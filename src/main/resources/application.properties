spring.application.name=desenv-sistemas

# PostgreSQL — usa variável de ambiente em produção
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/desenv_sistemas}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Servidor — Render injeta a variável PORT automaticamente
server.port=${PORT:8081}

# Email — Brevo SMTP relay (porta 465/SSL direto: 587/STARTTLS costuma ser
# bloqueada por firewalls corporativos e de alguns provedores de hospedagem)
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:b44431001@smtp-brevo.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.enable=true
mail.from=${MAIL_FROM:noreply@femass.edu.br}

# Prazo de aprovação — dias de antecedência para o aviso por e-mail
app.prazo.aviso-dias-antes=${PRAZO_AVISO_DIAS_ANTES:2}

# Armazenamento de anexos — Supabase Storage (API compatível com S3)
storage.endpoint=${STORAGE_ENDPOINT:}
storage.region=${STORAGE_REGION:us-east-1}
storage.access-key-id=${STORAGE_ACCESS_KEY_ID:}
storage.secret-access-key=${STORAGE_SECRET_ACCESS_KEY:}
storage.bucket-name=${STORAGE_BUCKET_NAME:}
storage.public-url=${STORAGE_PUBLIC_URL:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
