spring.application.name=desenv-sistemas

# PostgreSQL — usa variável de ambiente em produção
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/desenv_sistemas}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Servidor — Render injeta a variável PORT automaticamente
server.port=${PORT:8081}

# Email
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME:e6af38116fac7c}
spring.mail.password=${MAIL_PASSWORD:53e3a4934ee4bd}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=noreply@femass.edu.br
